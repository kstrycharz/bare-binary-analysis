# BARE release gate — Azure DevOps

trigger:
  tags:
    include: ["v*"]

pool:
  vmImage: windows-latest

variables:
  artifact: $(Build.ArtifactStagingDirectory)/installer.exe

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.12"

  - script: msbuild MyProduct.sln /p:Configuration=Release
    displayName: Build

  # Not on PyPI yet — pin a tag or use an internal feed.
  - script: pip install "bare @ git+https://dev.azure.com/org/bare@v0.0.1"
    displayName: Install BARE CLI

  # The attestation fills itself in from BUILD_REQUESTEDFOR and BUILD_BUILDURI.
  - script: |
      bare scan "$(artifact)" ^
        --sarif "$(Build.ArtifactStagingDirectory)/bare.sarif" ^
        --json  "$(Build.ArtifactStagingDirectory)/bare.json" ^
        --timeout 1800
    displayName: BARE release gate
    env:
      BARE_API_URL: $(BareApiUrl)
      # A ci-scoped token; see docs/CICD.md section 4.
      BARE_TOKEN: $(BareToken)

  # `always()` — the verdict is most worth keeping on the run that failed.
  - publish: $(Build.ArtifactStagingDirectory)/bare.json
    artifact: bare-verdict
    condition: always()
    displayName: Publish verdict

  # Reached only when the gate exits 0.
  - script: ./scripts/publish.ps1
    displayName: Publish release
