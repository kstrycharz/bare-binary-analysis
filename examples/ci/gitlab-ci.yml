# BARE release gate — GitLab CI
#
# Copy the `release-gate` job into your .gitlab-ci.yml.

stages:
  - build
  - verify
  - publish

variables:
  ARTIFACT: dist/installer.exe

build:
  stage: build
  # BARE_TOKEN must be a **ci**-scoped token: a build agent submits and
  # receives a verdict, and must not be able to read the findings corpus.
  #   bare token create gitlab-ci --scope ci --expires-in-days 90
  script:
    - ./scripts/build.sh
  artifacts:
    paths:
      - dist/

release-gate:
  stage: verify
  image: python:3.12-slim
  needs: ["build"]
  before_script:
    # Not on PyPI yet — pin a tag or use an internal index. A gate that
    # updates itself silently has a verdict you cannot reproduce.
    - pip install --no-cache-dir "bare @ git+https://gitlab.example.com/sec/bare@v0.0.1"
  script:
    # BARE_API_URL and BARE_TOKEN come from masked CI/CD variables.
    # The attestation fills itself in from GITLAB_USER_LOGIN and
    # CI_PIPELINE_URL, so the audit log records who triggered the release.
    - |
      bare scan "$ARTIFACT" \
        --sarif gl-sast-report.json \
        --json  bare-verdict.json \
        --timeout 1800
  artifacts:
    when: always          # the report matters most when the job failed
    expire_in: 30 days
    paths:
      - bare-verdict.json
    reports:
      sast: gl-sast-report.json

publish:
  stage: publish
  needs: ["release-gate"]   # a blocked gate fails the job and stops this stage
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - ./scripts/publish.sh
