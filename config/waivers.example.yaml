# BARE waivers
#
# Copy to `.bare/waivers.yaml`. Each entry exempts ONE finding, by its
# content-derived id, until a date that must be stated.
#
# Every field is required by default. That is the point: a waiver is a decision
# to ship a known exposure, and it should carry a name, a reason, and an end
# date the way any other risk acceptance does. A waiver with no expiry is a
# permanent hole that outlives the person who opened it — the loader rejects
# one rather than defaulting it.
#
# Get a finding id from the CI output, the dashboard, or the JSON verdict.

waivers: []

